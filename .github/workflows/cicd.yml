name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # Doc secret qua bien moi truong (khong chen truc tiep vao script) de JSON
        # chua ky tu dac biet khong lam hong lenh shell.
        # Dong `dvc remote modify --local` ghi de credentialpath (neu .dvc/config co
        # tro toi ../sa-key.json tren may ca nhan) bang file key tren runner.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          printf '%s' "$STORAGE_CREDENTIALS" > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          dvc remote modify --local labstore credentialpath /tmp/sa-key.json

      - name: Pull data with DVC
        # Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Configure remote MLflow tracking (Bonus 1, tuy chon)
        # Neu da them secrets cua DagsHub thi ghi run len DagsHub,
        # neu chua co thi MLflow ghi vao thu muc cuc bo tren runner nhu binh thuong.
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          if [ -n "$MLFLOW_TRACKING_URI" ]; then
            echo "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_USERNAME=$MLFLOW_TRACKING_USERNAME" >> $GITHUB_ENV
            echo "MLFLOW_TRACKING_PASSWORD=$MLFLOW_TRACKING_PASSWORD" >> $GITHUB_ENV
            echo "MLFLOW_EXPERIMENT_NAME=income-model-ci" >> $GITHUB_ENV
            echo "MLflow tracking: remote server."
          else
            echo "MLflow tracking: cuc bo tren runner (chua cau hinh DagsHub)."
          fi

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Detailed precision / recall report (Bonus 3)
        run: python src/evaluate.py

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"])
          for local_path, key in [
              ("models/model.joblib", "artifacts/current/model.joblib"),
              ("outputs/report.json", "artifacts/current/report.json"),
          ]:
              bucket.blob(key).upload_from_filename(local_path)
              print(f"Uploaded {local_path} -> gs://{bucket.name}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # Output cua job la chuoi, phai doi sang float truoc khi so sanh.
        run: |
          python - <<'PYEOF'
          raw = "${{ needs.train.outputs.f1 }}"
          if not raw:
              raise SystemExit("FAILED: khong doc duoc f1_score tu job Train. Huy trien khai.")

          f1 = float(raw)
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Restart de serve.py tai lai model moi nhat tu cloud storage
            sudo systemctl restart income-api || exit 1

            # Server can vai giay de tai model va import thu vien, thu lai toi da 12 lan x 5 giay
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed (lan thu $i)."
                exit 0
              fi
              echo "Server chua san sang, thu lai ($i/12)..."
            done

            echo "Health check FAILED sau 12 lan thu."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
